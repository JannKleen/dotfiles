# ~/.tmux.conf — tabs with | separators and SSH/Mosh-aware window names
# Managed via GNU stow from dotfiles (package: tmux)
#
# This config shows a simple status bar with '|' between window (tab) names.
# It also auto-renames a window to the remote host when the foreground command
# in the active pane is ssh or mosh/mosh-client.
#
# If you symlink this repo to your home, also symlink the helper script to:
#   ln -s "$HOME/Development/dotfiles/tmux/remote_host.sh" "$HOME/.tmux/remote_host.sh"
# Or update the path below to point to the script in this repo.

# remap prefix from 'C-b' to 'C-a'
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# Basic status bar with window list
set -g status on
set -g status-interval 2

# Use simple formats: show window index and name
set -g window-status-format " #I #W "
set -g window-status-current-format " #I #W "

# Put a vertical bar between window names ("tabs")
set -g window-status-separator " | "

# Let tmux rename windows automatically using our custom format
set -g automatic-rename on
# Avoid programs changing the name unexpectedly; rely on our format instead
set -g allow-rename off

# Rename window to remote host if foreground command is ssh or mosh; otherwise show the command
set -g automatic-rename-format '#{?#{==:#{pane_current_command},ssh},#(/bin/sh $HOME/.tmux/remote_host.sh #{pane_tty} #{pane_current_command}),#{?#{m:#{pane_current_command},mosh*},#(/bin/sh $HOME/.tmux/remote_host.sh #{pane_tty} #{pane_current_command}),#{pane_current_command}}}'

# Remove right status content (no time/date)
set -g status-right ""

# Enable mouse control (clickable windows, panes, resizable panes)
set -g mouse on
